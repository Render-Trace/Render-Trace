<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Render Trace | Calculadora</title>
    <link rel="icon" type="image/x-icon" href="assets/images/logo-cadastro.png">
    <link rel="stylesheet" href="https://use.typekit.net/wgs2ohu.css">
    <link rel="stylesheet" href="styles/calculadora.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <header>
        <div class="header-container">
            <a href="home.html"><img src="assets/images/logo-branca.svg" alt="Logo RenderTrace"></a>
            <nav>
                <ul>
                    <li><a href="home.html#sobre-section">Sobre nós</a></li>
                    <li><a href="home.html#solucoes-section">Soluções</a></li>
                    <li><a href="home.html#contato-section">Contato</a></li>
                    <li><a href="calculadora.html" class="selected">Calculadora</a></li>
                    <li class="nav-button nav-entrar"><a href="login.html">Entrar</a></li>
                    <li class="nav-button nav-cadastro"><a href="cadastro.html" class="primaria">Cadastro</a></li>
                </ul>
            </nav>
        </div>
    </header>

    </div>

    <div class="container">
        <div class="container-informacao">
            <div class="container-inputs">
                <!-- Quantidade de resíduos processados pela fábrica por mês. -->
                <label for="ipt_insumo_processado">Insumo processado (kg/mês): </label>
                <input type="text" value="600000" id="ipt_insumo_processado"> <br>

                <!-- Quantidade média de horas em que a linha fica parada -->
                <label for="ipt_downtime">Horas paradas/mês: </label>
                <input type="text" value="6" id="ipt_downtime"> <br>
            </div>
            <button onclick="calcular()">SIMULAR DIAGNÓSTICO</button>
        </div>

        <div class="container-calculo">
            <div class="container-prejuizototal">
                <h2>Prejuízo Anual Estimado sem a RenderTrace</h2>
                <h1 id="h1_prejuizototal"></h1>
            </div>

            <div class="container-valorrecuperado">
                <h2>Economia Anual Estimada com a RenderTrace</h2>
                <h1 id="h1_valorrecuperado"></h1>
            </div>
            <div class="container-economia">
                <p id="p_diminuicao"></p>
                <p id="p_eficiencia"></p>
            </div>
            <div class="container-contato" id="container_contato">
            </div>
        </div>

    </div>

    <div id="div_msg"></div>

</body>
<script>
    let validacao = true;
    function calcular() {

        let insumo_processado = Number(ipt_insumo_processado.value);
        let downtime = Number(ipt_downtime.value);
        let valor_produto = 2.50;
        let rendimento = 43.5
        let perda_transbordo = 5;
        let custo_hora_parada = Number(1200);

        validacao = true
        validar()
        if (validacao) {
            h1_prejuizototal.innerHTML = '<img src="assets/images/loading.gif" width="80">'
            h1_valorrecuperado.innerHTML = '<img src="assets/images/loading.gif" width="80">'
            setTimeout(() => {
                let massa_perdida = insumo_processado * perda_transbordo / 100;
                let produto_nao_gerado = massa_perdida * rendimento / 100;
                let prejuizo_transbordo = produto_nao_gerado * valor_produto;
                let prejuizo_downtime = custo_hora_parada * downtime;



                let prejuizo_por_mes = prejuizo_transbordo + prejuizo_downtime;
                let prejuizo_por_ano = prejuizo_por_mes * 12;


                let valor_recuperado = prejuizo_por_ano * 0.25;

                let diminuicao = (valor_recuperado * 100) / prejuizo_por_ano;
                let eficiencia = diminuicao


                h1_prejuizototal.innerHTML = `${prejuizo_por_ano.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })} <span>/ANO</span>`;

                h1_valorrecuperado.innerHTML = `${valor_recuperado.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })} <span>/ANO</span>`;

                p_diminuicao.innerHTML = `<i class="fa fa-caret-down" aria-hidden="true"></i> <span>${diminuicao}%</span> de <span>DIMINUIÇÃO</span> no prejuízo`;
                p_eficiencia.innerHTML = `<i class="fa fa-caret-up" aria-hidden="true"></i> <span>${eficiencia}%</span> de <span>EFICIÊNCIA</span>`;
                container_contato.innerHTML = '<button>ENTRE EM CONTATO AGORA!</button>'
            }, 1000)
        }
    }

    function validar() {
        let insumo_processado = Number(ipt_insumo_processado.value);
        let downtime = Number(ipt_downtime.value);
        let valor_produto = 2.50;
        let rendimento = 43.5
        let perda_transbordo = 5;
        let custo_hora_parada = Number(1200);

        if (insumo_processado <= 0) {
            alert('Insumo deve ser maior que 0')
            validacao = false
        }

        if (downtime <= 0) {
            alert('A média de downtime deve ser maior que 0')
            validacso = false
        }
    }
</script>

</html>
