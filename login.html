<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/login.css">
    <title>login</title>
</head>

<body>
    <div class="container">

        <div class="lado-esquerdo">
            <div class="logo-esquerda">
                <img src="assets/images/logo-branca.svg" alt="">
            </div>

            <div class="formulario">
                <div class="login-textos">
                    <h2>Entre</h2>
                    <p>Não possui cadastro? <span>crie agora</span></p>
                </div>

                <div class="login-inputs">
                    <div class="campo">
                        <label for="ipt_email">E-mail</label>
                        <input type="text" id="ipt_email">
                    </div>
                    <div class="campo">
                        <label for="ipt_senha">Senha</label>
                        <input type="text" id="ipt_senha">
                    </div>

                    <div class="login-campo">
                        <div>
                            <label for="ipt_lembre">Lembre-se</label>
                            <input type="checkbox">
                        </div>

                        <p>Esqueceu a senha?</p>
                    </div>
                </div>

                <div class="login-div-botao">
                    <button onclick="logar()">Entrar</button>
                </div>

            </div>

        </div>

        <div class="lado-direito"></div>

    </div>
</body>

</html>
