<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="assets/images/logo-cadastro.png">
    <title>Render Trace | Cadastro</title>
</head>

<body>

    <div class="container">


        <div class="lado-esquerdo">

            <div class="logo-esquerda">
                <a href="home.html"><img src="assets/images/logo-verde.svg" alt="Render Trace Logo"></a>
            </div>

            <div class="formulario">

                <h1>Entre</h1>

                <div class="campo">
                    <label for="input_email">E-mail</label>
                    <input type="email" id="input_email" value="leonardodias@email.com">
                </div>

                <div class="campo">
                    <label for="input_senha">Senha</label>
                    <input type="password" oninput="verificar()" id="input_senha" value="Senha123">
                    <div class="mensagem-senha" id="div_mensagem_senha"></div>
                </div>

                <div class="login-campo">
                    <div>
                        <label for="ipt_lembre">Lembre-se</label>
                        <input type="checkbox">
                    </div>

                    <p>Esqueceu a senha?</p>
                </div>

                <button onclick="login()">Entrar</button>
                <div id="div_mensagem2"></div>

            </div>

        </div>
        <div class="lado-direito">
            <div class="container-imagem-destaque">

                <img src="assets/images/home.png" alt="imagem home" class="imagem-fundo-destaque">

                <div class="tag-desconto">
                    <p>Redução de prejuízos até</p>
                    <div class="img-texto">
                        <img src="assets/images/money.png" alt="">
                        <span>25%</span>
                    </div>
                </div>
                <div class="texto-login">
                    <p>Não possui cadastro? <a href="cadastro.html"><span>Crie agora</span></p></a>
                </div>

            </div>

        </div>
    </div>

</body>

</html>

<script>
    let tentativasRestantes = 3;

    function login() {
        let email = input_email.value
        let senha = input_senha.value

        if (email == 'leonardodias@email.com' && senha == 'Senha123') {
            div_mensagem2.innerHTML = `<span style="color: #164636;">Usuário logado com sucesso!<br>Redirecionando para a tela de dashboards...</span>`

            setTimeout(() => {
                window.location.href= 'dashboard/dashboard-geral.html'
            }, 1000)

        } else {
            tentativasRestantes--;
            div_mensagem2.innerHTML = `<span style="color: brown;">Usuário ou senha inválidos. Restam ${tentativasRestantes} tentativa(s).</span>`

            if (tentativasRestantes == 0) {
                alert('Você atingiu o limite de 3 tentativas. Você será redirecionado para a página inicial.');
                window.location.href = 'home.html';
            }
        }
    }
</script>
