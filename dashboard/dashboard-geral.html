<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/images/logo-cadastro.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles/sidebar.css">
    <link rel="stylesheet" href="../styles/dashboard-geral.css">
    <title>Render Trace | Dashboard</title>
</head>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<body>

    <header>
        <div class="header-container">
            <a href="../home.html"><img src="../assets/images/logo-branca.svg" alt="Logo RenderTrace"></a>
        </div>
    </header>
    <div class="lado-esquerdo">

        <div class="conteudo-esquerda">

            <div class="itens-usuario">
                <img src="../assets/images/pessoa.svg" alt="ícone pessoa">
                <div class="itens-informacao">
                    <h1>Nome do Usuário</h1>
                    <h2>Administrador</h2>
                    <h3>nomedousuario@gmail.com</h3>
                </div>
            </div>


            <div class="itens-selecao">
                <div class="img-texto cor-sidebar background-color-gray"
                    onclick="window.location.href='dashboard-geral.html'">
                    <svg width="41" height="41" viewBox="0 0 41 41" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M28.413 5.33001C26.404 6.15001 26.24 7.21601 26.24 20.5C26.24 33.907 26.363 34.604 28.495 35.588C30.832 36.654 33.661 35.916 34.686 33.989C35.588 32.226 35.547 8.69201 34.645 6.92901C33.661 5.08401 30.832 4.34601 28.413 5.33001Z"
                            fill="currentColor" />
                        <path
                            d="M17.343 14.514L16.195 15.498L16.072 24.026C15.99 29.971 16.072 32.882 16.441 33.702C17.712 36.818 23.288 36.818 24.559 33.702C24.928 32.882 25.01 29.971 24.928 24.026L24.805 15.498L23.657 14.514C22.058 13.12 18.942 13.12 17.343 14.514Z"
                            fill="currentColor" />
                        <path
                            d="M7.09293 23.124C5.98593 24.067 5.94493 24.313 5.82193 28.29C5.69893 30.955 5.82193 32.882 6.14993 33.661C7.50293 36.859 12.9969 36.859 14.3499 33.661C14.6779 32.882 14.8009 30.955 14.6779 28.29C14.5549 24.313 14.5139 24.067 13.4069 23.124C11.8079 21.73 8.69193 21.73 7.09293 23.124Z"
                            fill="currentColor" />
                    </svg>
                    <span>Dashboards</span>
                </div>
                <div class="img-texto" onclick="window.location.href='dashboard-tolvas.html'">
                    <img src="../assets/images/Box.svg" alt="">
                    <span>Tolvas</span>
                </div>
                <div class="img-texto" onclick="window.location.href='dashboard-usuarios.html'">
                    <img src="../assets/images/User.svg" alt="">
                    <span>Usuários</span>
                </div>
            </div>



            <div class="itens-botao">
                <button onclick="logout()">Desconectar</button>
            </div>

        </div>


    </div>

    <main>
        <section class="container">

            <div class="lado-direito">

                <div class="topo-dashboard">

                    <section id="visao-ampla">

                        <div class="selecao-tolva">

                            <div class="opcoes-tolvas">
                                <select id="select_tolva" onchange="mudarDashboard()">
                                    <option value="0">Visão ampla</option>
                                    <option value="1">Tolva 1</option>
                                    <option value="2">Tolva 2</option>
                                    <option value="3">Tolva 3</option>
                                    <option value="4">Tolva 4</option>
                                </select>

                                <p><b class="destaque-atualizacao">Última atualização:</b> 18:10 - 30/09/2026</p>

                            </div>

                        </div>

                    </section>

                </div>

                <section class="indicadores-gerais">

                    <div class="kpi-row">

                        <span class="kpi"><span class="kpi-titulo">Situação geral</span>
                            <span class="kpi-info destaque">Normal</span>
                            <span class="kpi-descricao">Consolidado da planta</span></span>

                        <span class="kpi"><span class="kpi-titulo">Tolvas operando</span>
                            <span class="kpi-info">4/5</span>
                            <span class="kpi-descricao">Equipamentos ativos no turno</span> </span>

                    </div>

                </section>

                <section class="analise-operacional">

                    <div class="grafico-container">

                        <div class="area-grafico">

                            <div class="canvas-container">
                                <canvas id="myChart"></canvas>
                            </div>

                        </div>

                    </div>


                            <div class="container-grafico-2">

                                <div class="area-grafico-2">

                                    <div class="canvas-container-2">
                                        <canvas id="myChart2"></canvas>
                                    </div>

                                </div>

                            </div>


                        </div>

                    </div>

                </section>

            </div>
        </section>
    </main>

</body>

</html>

<script>

    function mudarDashboard() {
        let tolva = select_tolva.value

        console.log(tolva)

        if (tolva == 0) {
            window.location = 'dashboard-geral.html'
        } else if (tolva == 1) {
            window.location = 'dashboard-individual.html'
        }
    }

    function logout() {
        window.location.href = '../login.html'
    }
    const ctx = document.getElementById('myChart');
    const ctx2 = document.getElementById('myChart2');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Tolva 1', 'Tolva 2', 'Tolva 3', 'Tolva 4'],
            datasets: [{
                label: 'Ocupação atual das tolvas',
                data: [50, 84, 65, 8],
                borderWidth: 0,
                backgroundColor: [
                    '#7ED957',
                    '#8A3335',
                    '#7ED957',
                    '#5D5D5D',
                ],
            }]
        },
        options: {

            responsive: true,
            maintainAspectRatio: false,

            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    new Chart(ctx2, {
        type: 'bar',
        data: {
            labels: ['Tolva 1', 'Tolva 2', 'Tolva 3', 'Tolva 4'],
            datasets: [{
                label: 'Contagem de alertas no período',
                data: [7, 3, 1, 2],
                borderWidth: 0,
                backgroundColor: [
                    '#8A3335',
                    '#7ED957',
                    '#7ED957',
                    '#7ED957',
                ],
            }]
        },
        options: {

            responsive: true,
            maintainAspectRatio: false,

            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });


</script>
